syntax = "proto3";

package mdaf.v1;

import "google/protobuf/struct.proto";

option go_package = "re/gen/mdafv1;mdafv1";

service RuleEngine {
  rpc AnalyzeAlert(AnalyzeAlertRequest)
      returns (AnalyzeAlertResponse);
}

message AnalyzeAlertRequest {
  string request_id     = 1;
  Alert alert           = 2;
}

message AnalyzeAlertResponse {
  string request_id     = 1;
  AnalysisStatus status = 2;
  RootCauseAnalysis rca = 3;
  AnalysisMeta meta     = 4;
}

message Alert {
  string id                 = 1;
  string source_path        = 2;
  string alert_type         = 3;
  string probable_cause     = 4;
  string perceived_severity = 5;
  string state              = 6;
  string created_at         = 7;
  google.protobuf.Struct additional_information = 8;
}

message AnalysisStatus {
  string overall    = 1;
  string context    = 2;
  string rca        = 3;
}

message RootCauseAnalysis {
  repeated RootCause root_causes = 1;
}

message RootCause {
  string category   = 1;
  string role       = 2; // PRIMARY | CONTRIBUTING | SUSPECTED
  string summary    = 3;
  repeated Component components = 4;
}

message Component {
  string entity            = 1;
  RecommendedAction action = 2;
}

message RecommendedAction {
  string code           = 1;
  string mo_instance    = 2;
  string op             = 3; // ADD | REMOVE | REPLACE
  google.protobuf.Value value = 4;
}

message AnalysisMeta {
  string context_status = 1;
  repeated MissingContext missing_context = 2;
}

message MissingContext {
  string provider   = 1;
  string entity     = 2;
  string key        = 3;
  string reason     = 4;
}
