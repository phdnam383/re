apiVersion: v1
kind: ConfigMap
metadata:
  name: configuration-stub
  labels:
    app.kubernetes.io/name: configuration-stub
data:
  default.conf: |
    server {
      listen 8080;

      # Every path answers the same JSON number. The provider decodes one JSON
      # value per target, and 5 is what db/seed_test.sql documents as the
      # fixture — it is what makes the log-file rule fire.
      location / {
        default_type application/json;
        return 200 '5';
      }
    }
  nginx.conf: |
    # Bind on a port >= 1024 so the pod can run with UID 101 (see the
    # securityContext below). The PID file and nginx's temp/cache dirs are
    # moved under /tmp, which is the writable emptyDir mount in this pod;
    # the image's defaults all point at root-owned paths that UID 101 cannot.
    pid /tmp/nginx.pid;

    worker_processes auto;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      include /etc/nginx/mime.types;
      default_type application/octet_stream;

      include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-stub
  labels:
    app.kubernetes.io/name: configuration-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: configuration-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configuration-stub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: docker-registry:4000/nginx:alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # subPath, NOT a directory mount: a ConfigMap volume exposes EVERY
            # key as a file. Mounting the whole ConfigMap at conf.d would also
            # drop nginx.conf there, and the main config's `include conf.d/*.conf`
            # would re-parse it inside http{} — where top-level directives like
            # `pid` are illegal (nginx emerg: "pid directive is not allowed
            # here"). Mount only the server block.
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-main
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /v1/probe
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: configuration-stub
        - name: nginx-main
          configMap:
            name: configuration-stub
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: configuration-stub
spec:
  selector:
    app.kubernetes.io/name: configuration-stub
  ports:
    - name: http
      port: 80
      targetPort: http
