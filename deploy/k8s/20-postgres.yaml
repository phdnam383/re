apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: docker-registry:4000/postgres:14-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: re
            - name: POSTGRES_USER
              value: ifm
            - name: POSTGRES_PASSWORD
              value: "1111"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # initdb runs *.sql under /docker-entrypoint-initdb.d once, on the
          # first start of an empty PGDATA dir. This loads schema + seed in
          # dependency order (alphabetical: schema.sql then seed_test.sql), so
          # there is no separate schema Job to gate on or to clean up before a
          # re-run. The volatile emptyDir means PGDATA is wiped on every pod
          # restart — acceptable for a throwaway test stack; every restart
          # re-initialises a clean, seeded DB.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ifm", "-d", "re"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ifm", "-d", "re"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: initdb
          configMap:
            name: rule-engine-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
