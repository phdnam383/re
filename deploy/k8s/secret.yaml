# Development credentials.
#
# These are placeholders and are committed on purpose so `kubectl apply -k`
# brings up a working cluster in one step. They are not a secret in any useful
# sense — anyone reading this repository has them.
#
# For anything shared, replace this file: point RE_DB_DSN at a managed
# PostgreSQL and supply the secret from a real store (External Secrets, SOPS,
# a cloud secret manager). Do not edit the password here and consider it
# handled; the value would still be in the git history.
#
# The DSN is a separate key from the username and password because the engine
# takes a whole DSN while the postgres container takes the parts. Deriving one
# from the other at deploy time would need a template engine this deployment
# deliberately does not have.
apiVersion: v1
kind: Secret
metadata:
  name: re-database
  labels:
    app.kubernetes.io/part-of: re
type: Opaque
stringData:
  username: re
  password: dev-only-not-a-secret

  # sslmode=disable is acceptable only because this DSN never leaves the
  # cluster network. A managed database must use verify-full.
  dsn: postgres://re:dev-only-not-a-secret@postgres:5432/re?sslmode=disable
