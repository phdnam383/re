apiVersion: apps/v1
kind: Deployment
metadata:
  name: re-engine
  labels:
    app.kubernetes.io/name: re-engine
    app.kubernetes.io/part-of: re
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: re-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re-engine
    spec:
      # The engine holds no state between requests, so a pod can be replaced at
      # any time. GracefulStop gives in-flight analyses ten seconds; the
      # termination grace period has to be longer than that or the kubelet
      # would SIGKILL the process in the middle of its own shutdown.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # The UID has to be stated numerically. The image declares
        # `USER nonroot`, and the kubelet cannot resolve a name to a UID
        # without running the container first — so with runAsNonRoot set and no
        # runAsUser it refuses to start it at all. 65532 is distroless's
        # nonroot user; it must match the base image, not just be non-zero.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: re-engine:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 30051
          env:
            - name: RE_GRPC_ADDR
              value: ":30051"
            - name: RE_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: re-database
                  key: dsn
            - name: RE_CONFIGURATION_TIMEOUT
              value: "2s"
            - name: RE_RCA_RULE_TIMEOUT
              value: "800ms"
          # A TCP probe rather than a gRPC health check, because the service
          # deliberately exposes no health API. It is still a meaningful signal:
          # the engine pings PostgreSQL before it binds the port, so a pod that
          # is accepting connections has already proved it can reach its data.
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # No CPU limit: a rule document is bounded by its own 800ms
              # timeout, and throttling would make that timeout fire for
              # reasons the rule author cannot see.
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: re-engine
  labels:
    app.kubernetes.io/name: re-engine
    app.kubernetes.io/part-of: re
spec:
  selector:
    app.kubernetes.io/name: re-engine
  ports:
    - name: grpc
      port: 30051
      targetPort: grpc
